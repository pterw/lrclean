name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Three test groups create paths over 260 characters without the
      # extended prefix, so the runner needs long paths switched on.
      - name: Enable long paths
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue | Select-Object LongPathsEnabled
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 1
          Get-ItemProperty -Path $key -Name LongPathsEnabled | Select-Object LongPathsEnabled

      - name: Run the unit suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      # Reads the first dated heading of the changelog and the project
      # version; on a tag, the tag without its leading v is the third value.
      - name: Check the version
        shell: python
        run: |
          import os
          import re
          import sys
          import tomllib

          heading = re.compile(r"## ([0-9]+\.[0-9]+\.[0-9]+) - [0-9]{4}-[0-9]{2}-[0-9]{2}")
          plain = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")
          found = {"CHANGELOG.md": None, "pyproject.toml": None}
          with open("CHANGELOG.md", encoding="utf-8") as f:
              for line in f:
                  m = heading.fullmatch(line.rstrip("\r\n"))
                  if m:
                      found["CHANGELOG.md"] = m.group(1)
                      break
          with open("pyproject.toml", "rb") as f:
              found["pyproject.toml"] = tomllib.load(f).get("project", {}).get("version")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              found["tag"] = os.environ.get("GITHUB_REF_NAME", "").removeprefix("v")
          bad = [k for k, v in found.items() if not (isinstance(v, str) and plain.fullmatch(v))]
          if bad or len(set(found.values())) != 1:
              sys.exit(f"Version check failed: {found}")
          print(f"Version check passed: {found}")
